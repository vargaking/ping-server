# Nginx reverse proxy for ping-server (production + staging).
# Install to /etc/nginx/sites-available/ping-server and symlink into
# /etc/nginx/sites-enabled/. Replace the server_name domains with yours.
#
# WebSocket support (/ws) requires the Upgrade/Connection headers below.
# TLS is added automatically by `certbot --nginx` (see DEPLOYMENT.md).

# Map the Upgrade header once, reused by both server blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ping_production {
    server 127.0.0.1:8000;
}

upstream ping_staging {
    server 127.0.0.1:8001;
}

# --- Production ---
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 25M;

    location /ws {
        proxy_pass http://ping_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://ping_production;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Staging ---
server {
    listen 80;
    listen [::]:80;
    server_name staging.api.example.com;

    client_max_body_size 25M;

    location /ws {
        proxy_pass http://ping_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://ping_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
