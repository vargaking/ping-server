# ping-server + LiveKit reverse proxy — HTTPS (self-signed, VPN/IP access).
#   :443  -> production API   (127.0.0.1:8000)
#   :8443 -> staging API      (127.0.0.1:8001)
#   :7444 -> production LiveKit WSS (127.0.0.1:7882)
#   :7443 -> staging LiveKit WSS    (127.0.0.1:7880)
# Plain :80 / :8080 kept as HTTP -> redirect to HTTPS for the API.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ping_production { server 127.0.0.1:8000; }
upstream ping_staging    { server 127.0.0.1:8001; }
upstream lk_production   { server 127.0.0.1:7882; }
upstream lk_staging      { server 127.0.0.1:7880; }

ssl_certificate     /etc/ssl/ping/ping.crt;
ssl_certificate_key /etc/ssl/ping/ping.key;

# --- Production API :443 ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    client_max_body_size 25M;

    location /ws {
        proxy_pass http://ping_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://ping_production;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Staging API :8443 ---
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    client_max_body_size 25M;

    location /ws {
        proxy_pass http://ping_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://ping_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Production LiveKit WSS :7444 ---
server {
    listen 7444 ssl;
    listen [::]:7444 ssl;
    server_name _;

    location / {
        proxy_pass http://lk_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# --- Staging LiveKit WSS :7443 ---
server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name _;

    location / {
        proxy_pass http://lk_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# --- HTTP :80 -> redirect to HTTPS (production) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTP :8080 -> redirect to HTTPS staging (:8443) ---
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}
