name: Deploy ping-server

on:
  push:
    branches: [master, staging]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run DB migrations (staging shares prod DB — use with care)"
        type: boolean
        default: false

concurrency:
  # Serialize deploys per environment.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check sources
        run: python -m compileall app

      # Add your real test suite here, e.g.:
      # - name: Run tests
      #   run: pytest

  deploy:
    name: Deploy
    needs: test
    # Runs on the self-hosted runner installed on the server itself, so the
    # deploy is a local operation — no SSH, no inbound network from GitHub.
    runs-on: [self-hosted, ping-server]
    steps:
      - name: Select environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            # Staging shares the prod DB: migrations OFF unless manually requested.
            echo "run_migrations=${{ github.event.inputs.run_migrations || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy locally
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          RUN_MIGRATIONS: ${{ steps.env.outputs.run_migrations }}
        run: |
          # deploy.sh lives in the target environment's checkout on this box;
          # run that copy so the script always matches the deployed code.
          case "$ENVIRONMENT" in
            production) APP_DIR=/opt/ping-server-production ;;
            staging)    APP_DIR=/opt/ping-server-staging ;;
          esac
          ENVIRONMENT="$ENVIRONMENT" RUN_MIGRATIONS="$RUN_MIGRATIONS" bash "$APP_DIR/scripts/deploy.sh"
