name: CI

# Runs on GitHub-hosted runners only. Never add the self-hosted deploy runner to
# a pull_request-triggered workflow: this repo is public, and a fork PR would
# then execute arbitrary code on the production box.
on:
  pull_request:
  push:
    branches-ignore: [master, staging] # those run the same tests inside deploy.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile-check sources
        run: python -m compileall -q app

      - name: Run tests
        run: pytest
