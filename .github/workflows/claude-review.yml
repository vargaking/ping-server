name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Fork PRs get no secrets, and the action refuses runs started by a bot push.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for defects that would hurt in production. Most PRs should get no comments at all. Silence is the expected result and there is no minimum.

            Worth a comment:
            - a bug: wrong result, crash, data loss, a race or ordering problem in WebSocket or realtime code
            - a security hole: an endpoint or WS event missing an auth or permission check, injection, a leaked secret, unsafe upload or file handling
            - a migration that loses data or can't run against the live database
            - an API or WS change that breaks a frontend one release behind

            Never comment on: style, naming, formatting, comments or docs, missing tests, refactoring ideas, "consider" or "might" suggestions, performance without an obvious cost, anything a linter, type checker or the test suite reports, code this PR didn't change.

            Before posting a finding:
            1. Read the code around it and its callers, not only the diff, and check the problem isn't already handled somewhere else.
            2. Name the concrete trigger: who does what, in which state, and what goes wrong. If you can't, drop the finding.
            3. Read the existing inline comments (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`) and drop anything already raised or answered there.

            Posting:
            - One inline comment per finding, on the line that has to change: the trigger, the consequence, the fix. A few sentences.
            - At most 5 findings. If you have more, keep the worst.
            - No summary, no praise, no verdict. If nothing passes the bar, post nothing and stop.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit"
