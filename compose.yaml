# Self-contained stack. Copy deploy/docker/.env.example to .env and fill it in.
services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: postgres://ping:${POSTGRES_PASSWORD:?}@db:5432/ping # ggignore: interpolated from .env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?}
      # Stored in upload URLs, so it must be absolute: the web client lives on another origin.
      MEDIA_BASE_URL: https://${DOMAIN:?}/media
      ATTACHMENT_URL_KEY: ${ATTACHMENT_URL_KEY:?}
      TRUSTED_PROXY_KEY: ${TRUSTED_PROXY_KEY:?}
      LIVEKIT_URL: wss://${DOMAIN:?}:7443
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DEBUG: "false"
      # One worker: live WebSocket connections are kept in process memory.
      GUNICORN_WORKERS: "1"
    volumes:
      - api_data:/data

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ping
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ping -d ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    volumes:
      - ./deploy/docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
      - livekit
    environment:
      DOMAIN: ${DOMAIN:?}
      TRUSTED_PROXY_KEY: ${TRUSTED_PROXY_KEY:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "7443:7443"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  api_data:
  db_data:
  caddy_data:
  caddy_config:
